kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[[services]]
localPort = 5000
name = "Bot Health"
paths = ["/"]

[services.development]
run = "pip install -r bot/requirements.txt -q && python bot/create_samples.py && python bot/bot.py"

[services.production]

[services.production.build]
args = ["sh", "-c", "pip install -r bot/requirements.txt -q && python bot/create_samples.py"]

[services.production.run]
args = ["python", "bot/bot.py"]

[services.production.run.env]
BOT_HEALTH_PORT = "5000"

[services.production.health.startup]
path = "/"
